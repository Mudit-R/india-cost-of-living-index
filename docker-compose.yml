version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: city_cost_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: city_cost_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: city_cost_web
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/api/v1/recommend
    depends_on:
      - api
    restart: unless-stopped
